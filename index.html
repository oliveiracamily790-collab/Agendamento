<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clean Clinic</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #000, #111, #1a1a1a);
            overflow: hidden;
        }

        body:before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: #00ff8850;
            border-radius: 50%;
            filter: blur(120px);
            animation: move 8s infinite alternate;
        }

        @keyframes move {
            to {
                transform: translate(250px, 150px);
            }
        }

        .card {
            width: 380px;
            padding: 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, .05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, .1);
            box-shadow: 0 0 30px #000;
            animation: show .8s;
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            background: #1e1e1e;
            color: #fff;
        }

        input:focus,
        select:focus {
            outline: none;
            box-shadow: 0 0 10px #00ff88;
        }

        button {
            background: #00ff88;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px #00ff88;
        }

        #msg {
            margin-top: 15px;
            text-align: center;
            color: #00ff88;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🏥 Clean Clinic</h1>

        <input id="nome" placeholder="Nome do paciente">

        <select id="esp">
            <option>Clínico Geral</option>
            <option>Pediatria</option>
            <option>Cardiologia</option>
            <option>Dermatologia</option>
        </select>

        <input type="date" id="data">
        <input type="time" id="hora">




        <button onclick="agendar()">
            Agendar Consulta
        </button>

        <div id="msg"></div>
    </div>

    <script>
        function agendar() {

            let n = nome.value;
            let d = data.value;
            let h = hora.value;

            if (!n || !d || !h) {
                msg.innerHTML = "⚠️ Preencha todos os campos";
                return;
            }

            msg.innerHTML =
                `✅ ${n}, consulta agendada para ${d} às ${h}`;

            nome.value = "";
            data.value = "";
            hora.value = "";
        }
    </script>

</body>

</html>
